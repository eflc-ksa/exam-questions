<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>عمر للاختبارات</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><div class="brand"><b>ع</b><span>عمر للاختبارات</span></div></header>
  <main>
    <section id="app">
      <p class="eyebrow">بنك الأسئلة</p>
      <h1>تدرّب على أسئلة الاختبارات</h1>
      <p class="muted">اختر القسم وابدأ الحل مجاناً، وستظهر لك النتيجة فور اختيار الإجابة.</p>
      <div class="appbar"><div><button id="back" class="secondary hidden">← جميع الأقسام</button><b id="heading">أقسام الاختبارات</b></div><div id="scores" class="hidden"><span class="good">الصحيحة: <b id="correctCount">0</b></span><span class="bad">الخاطئة: <b id="wrongCount">0</b></span></div></div>
      <div id="sectionGrid" class="grid"><p class="muted">جارٍ التحميل…</p></div>
      <section id="quiz" class="hidden"><div id="pageNav" class="pagebar"></div><div id="questionList"></div></section>
    </section>
    <p id="notice" class="error"></p>
  </main>
  <footer>عمر للاختبارات</footer>
</body>
</html>
